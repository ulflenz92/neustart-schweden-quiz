<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neustart Schweden – Quiz</title>
  <meta name="description" content="Teste dein Wissen rund um den Neustart in Schweden: Sprache, Behörden, Wohnen, Jobsuche und spannende Schweden-Fakten." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-badge">
      <span class="brand-mark" aria-hidden="true">NS</span>
      <span class="brand-name">Neustart Schweden</span>
    </div>
    <span class="eyebrow">Wie gut kennst du Schweden schon?</span>
    <h1>Das <em>Neustart</em>-Schweden-Quiz</h1>
    <p>
      Von Behörden-Basics bis Fun Facts über Elche und Mitternachtssonne ·
      <a class="home-link" href="https://neustart-schweden.de/">zurück zu neustart-schweden.de</a>
    </p>
  </header>

  <main>
    <section id="screen-categories" class="screen">
      <div id="track-tabs" class="track-tabs"></div>
      <div id="category-grid" class="category-grid"></div>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="quiz-card">
        <div class="quiz-header">
          <span id="quiz-category-label"></span>
          <button id="quit-button" class="quit-link" type="button">Kategorie wechseln</button>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-meta">
          <span id="progress-label"></span>
          <span id="difficulty-badge" class="difficulty-badge" hidden></span>
        </div>

        <p id="question-text"></p>
        <ul id="answers-list"></ul>

        <p id="feedback-box" class="feedback-box"></p>

        <button id="next-button" class="primary-button" type="button" hidden>Nächste Frage →</button>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-card">
        <p class="result-label">Dein Ergebnis</p>
        <p id="result-score">0 / 0</p>
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <div class="result-actions">
          <button id="retry-button" class="primary-button" type="button">Nochmal versuchen</button>
          <button id="other-category-button" class="secondary-button" type="button">Andere Kategorie</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Ein Projekt von <a href="https://neustart-schweden.de/">Neustart Schweden</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
